    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: #030508;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            color: #e0e0e0;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }
        
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            cursor: grab;
        }

        #canvas:active {
            cursor: grabbing;
        }
        
        .header {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 100;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .title {
            font-size: 11px;
            color: #4a5560;
            letter-spacing: 3px;
            text-transform: lowercase;
        }

        .status {
            display: flex;
            gap: 12px;
            font-size: 10px;
            color: #4a5560;
            letter-spacing: 1px;
            text-transform: lowercase;
            align-items: center;
            opacity: 0;
            transition: opacity 1s ease;
        }
        
        .status.visible {
            opacity: 1;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 4px;
            height: 4px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
            100% { opacity: 0.5; transform: scale(1); }
        }

        .separator {
            color: #2a3540;
        }

        .legend {
            position: fixed;
            bottom: 24px;
            left: 24px;
            display: flex;
            gap: 12px;
            z-index: 100;
            pointer-events: none;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: #4a5560;
            text-transform: lowercase;
            letter-spacing: 1px;
        }

        .legend-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            opacity: 0.8;
        }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10px;
            color: #4a5560;
            text-transform: lowercase;
            letter-spacing: 2px;
            z-index: 10;
        }
        
        .tooltip {
            position: fixed;
            background: rgba(10, 14, 18, 0.9);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 100;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: opacity 0.2s;
            opacity: 0;
            transform: translate(-50%, -100%);
            margin-top: -15px;
            text-align: center;
        }
        
        .tooltip.visible {
            opacity: 1;
        }
        
        .city-name {
            font-size: 10px;
            color: #888;
            letter-spacing: 1px;
            margin-bottom: 2px;
            text-transform: uppercase;
        }
        
        .aqi-val {
            font-size: 14px;
            font-weight: 400;
            color: #fff;
        }

        .hidden { display: none; }
        
        @media (max-width: 600px) {
            .legend {
                flex-direction: column;
                gap: 8px;
                bottom: 16px;
                left: 16px;
            }
            .legend-item {
                font-size: 9px;
                gap: 4px;
            }
            .legend-dot {
                width: 5px;
                height: 5px;
            }
        }

    ];

    let cityData = [];
    let particles = [];
    let focusedCity = null;
    let zoomAnimation = null;

    // Viewport State
    let view = {
        x: 0,
        y: 0,
        zoom: 0.8,
        minZoom: 0.4,  // Prevent zooming out too far (was 0.2)
        maxZoom: 4,    // Prevent excessive zoom in (was 6)
        width: 0,
        height: 0,
        isDragging: false,
        lastX: 0,
        lastY: 0
    };
    
    const WORLD_W = 2000;
    const WORLD_H = 1000;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const tooltip = document.getElementById('tooltip');

    function latLonToWorld(lat, lon) {
        const x = ((lon + 180) / 360) * WORLD_W;
        const y = ((90 - lat) / 180) * WORLD_H;
        return { x, y };
    }

    function worldToScreen(wx, wy) {
        const screenCX = view.width / 2;
        const screenCY = view.height / 2;
        const sx = screenCX + (wx - WORLD_W/2) * view.zoom + view.x;
        const sy = screenCY + (wy - WORLD_H/2) * view.zoom + view.y;
        return { x: sx, y: sy };
    }

    function applyBounds() {
        // Calculate the scaled world dimensions
        const scaledWorldW = WORLD_W * view.zoom;
        const scaledWorldH = WORLD_H * view.zoom;

        // Minimal padding beyond the world edges (5% of scaled world)
        const padding = 0.05;
        const maxOffsetX = scaledWorldW * (0.5 + padding);
        const maxOffsetY = scaledWorldH * (0.5 + padding);

        // Clamp pan to keep most of the world visible
        view.x = Math.max(-maxOffsetX, Math.min(maxOffsetX, view.x));
        view.y = Math.max(-maxOffsetY, Math.min(maxOffsetY, view.y));
    }

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        ctx.scale(dpr, dpr);
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        view.width = window.innerWidth;
        view.height = window.innerHeight;
    }
    
    resize();
    window.addEventListener('resize', () => setTimeout(resize, 100));

    function handleZoom(delta, centerX, centerY) {
        // factor: >1 zooms in, <1 zooms out
        const factor = delta > 0 ? 0.9 : 1.1;
        const newZoom = Math.min(view.maxZoom, Math.max(view.minZoom, view.zoom * factor));
        if (newZoom !== view.zoom) {
            const wx = ((centerX - view.width/2 - view.x) / view.zoom);
            const wy = ((centerY - view.height/2 - view.y) / view.zoom);
            view.zoom = newZoom;
            view.x = centerX - view.width/2 - (wx * view.zoom);
            view.y = centerY - view.height/2 - (wy * view.zoom);
            applyBounds(); // Enforce zoom bounds
        }
    }

    canvas.addEventListener('mousedown', e => { view.isDragging = true; view.lastX = e.clientX; view.lastY = e.clientY; });
    window.addEventListener('mousemove', e => {
        if (view.isDragging) {
            view.x += e.clientX - view.lastX;
            view.y += e.clientY - view.lastY;
            view.lastX = e.clientX;
            view.lastY = e.clientY;
            applyBounds(); // Enforce pan bounds
            checkInteraction(e.clientX, e.clientY);
        } else {
             checkInteraction(e.clientX, e.clientY);
        }
    });
    window.addEventListener('mouseup', () => view.isDragging = false);

    // Touch Handling - Consolidated for pan, pinch zoom, and tap-to-zoom
    let lastTouchDist = 0;
    let touchStartTime = 0;
    let touchStartPos = { x: 0, y: 0 };
    let lastTouchEndTime = 0; // Track last touch to prevent synthetic click events

    // Click to zoom into city (desktop only - ignore synthetic clicks from touch)
    canvas.addEventListener('click', e => {
        if (view.isDragging) return; // Don't trigger on drag release

        // Ignore synthetic click events that happen shortly after touch
        const timeSinceTouch = Date.now() - lastTouchEndTime;
        if (timeSinceTouch < 500) return;

        handleCityClick(e.clientX, e.clientY);
    });

    // Normalized Mouse Wheel
    canvas.addEventListener('wheel', e => {
        e.preventDefault();
        const delta = Math.sign(e.deltaY) * 100;
        handleZoom(delta, e.clientX, e.clientY);
    }, { passive: false });

    canvas.addEventListener('touchstart', e => {
        if (e.touches.length === 1) {
            view.isDragging = true;
            view.lastX = e.touches[0].clientX;
            view.lastY = e.touches[0].clientY;
            touchStartTime = Date.now();
            touchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            checkInteraction(e.touches[0].clientX, e.touches[0].clientY);
        } else if (e.touches.length === 2) {
            view.isDragging = false;
            const t1 = e.touches[0], t2 = e.touches[1];
            lastTouchDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        }
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
        e.preventDefault();
        if (e.touches.length === 1 && view.isDragging) {
            view.x += e.touches[0].clientX - view.lastX;
            view.y += e.touches[0].clientY - view.lastY;
            view.lastX = e.touches[0].clientX;
            view.lastY = e.touches[0].clientY;
            applyBounds(); // Enforce pan bounds
        } else if (e.touches.length === 2) {
            const t1 = e.touches[0], t2 = e.touches[1];
            const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
            const cx = (t1.clientX + t2.clientX) / 2;
            const cy = (t1.clientY + t2.clientY) / 2;

            // Direct scale ratio zoom
            const newScale = dist / lastTouchDist;
            const targetZoom = view.zoom * newScale;
            const clampedZoom = Math.min(view.maxZoom, Math.max(view.minZoom, targetZoom));

            if (clampedZoom !== view.zoom) {
                 const wx = ((cx - view.width/2 - view.x) / view.zoom);
                 const wy = ((cy - view.height/2 - view.y) / view.zoom);
                 view.zoom = clampedZoom;
                 view.x = cx - view.width/2 - (wx * view.zoom);
                 view.y = cy - view.height/2 - (wy * view.zoom);
                 applyBounds(); // Enforce zoom bounds
            }
            lastTouchDist = dist;
        }
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
        // Reset dragging state
        view.isDragging = false;

        // Check for tap gesture (quick touch with minimal movement)
        if (e.changedTouches.length === 1) {
            const touchDuration = Date.now() - touchStartTime;
            const touchEndPos = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
            const touchDist = Math.hypot(touchEndPos.x - touchStartPos.x, touchEndPos.y - touchStartPos.y);

            // If quick tap with minimal movement, treat as city zoom click
            if (touchDuration < 300 && touchDist < 10) {
                lastTouchEndTime = Date.now(); // Mark touch time to prevent synthetic click
                handleCityClick(touchEndPos.x, touchEndPos.y);
            }
        }
    });

    function handleCityClick(x, y) {
        if (focusedCity) {
            // Zoom out to default view
            animateToView(0, 0, 0.8, 800);
            focusedCity = null;
        } else {
            // Find city at click position
            let nearest = null;
            let minDist = 30;

            cityData.forEach(city => {
                const wPos = latLonToWorld(city.lat, city.lon);
                const sPos = worldToScreen(wPos.x, wPos.y);
                const d = Math.hypot(x - sPos.x, y - sPos.y);
                if (d < minDist) {
                    minDist = d;
                    nearest = city;
                }
            });

            if (nearest) {
                focusedCity = nearest;
                const wPos = latLonToWorld(nearest.lat, nearest.lon);
                const targetZoom = 3;
                // Calculate view offset to center the city at the target zoom level
                // worldToScreen formula: sx = screenCX + (wx - WORLD_W/2) * zoom + view.x
                // To center: screenCX = screenCX + (wx - WORLD_W/2) * zoom + view.x
                // Therefore: view.x = -(wx - WORLD_W/2) * zoom
                const targetX = -(wPos.x - WORLD_W/2) * targetZoom;
                const targetY = -(wPos.y - WORLD_H/2) * targetZoom;
                animateToView(targetX, targetY, targetZoom, 800);
            }
        }
    }

    function animateToView(targetX, targetY, targetZoom, duration) {
        const startX = view.x;
        const startY = view.y;
        const startZoom = view.zoom;
        const startTime = Date.now();

        if (zoomAnimation) cancelAnimationFrame(zoomAnimation);

        function animate() {
            const elapsed = Date.now() - startTime;
            const progress = Math.min(elapsed / duration, 1);

            // Ease out cubic for smooth deceleration
            const eased = 1 - Math.pow(1 - progress, 3);

            view.x = startX + (targetX - startX) * eased;
            view.y = startY + (targetY - startY) * eased;
            view.zoom = startZoom + (targetZoom - startZoom) * eased;

            if (progress < 1) {
                zoomAnimation = requestAnimationFrame(animate);
            } else {
                zoomAnimation = null;
            }
        }

        animate();
    }

    function checkInteraction(x, y) {
        let nearest = null;
        let minDist = 30;

        cityData.forEach(city => {
            const wPos = latLonToWorld(city.lat, city.lon);
            const sPos = worldToScreen(wPos.x, wPos.y);
            const d = Math.hypot(x - sPos.x, y - sPos.y);
            if (d < minDist) {
                minDist = d;
                nearest = city;
            }
        });

        if (nearest) {
            tooltip.querySelector('.city-name').textContent = nearest.name;
            tooltip.querySelector('.aqi-val').textContent = `${Math.round(nearest.aqi)} AQI`;
            const aqiInfo = getAQI(nearest.aqi);
            tooltip.querySelector('.aqi-val').style.color = `rgb(${aqiInfo.color.join(',')})`;
            tooltip.style.left = x + 'px';
            tooltip.style.top = (y - 20) + 'px';
            tooltip.classList.add('visible');
            canvas.style.cursor = 'pointer';
        } else {
            tooltip.classList.remove('visible');
            canvas.style.cursor = view.isDragging ? 'grabbing' : 'grab';
        }
    }

    function getAQI(aqi) {
        if (aqi <= 50) return { color: [34, 197, 94], class: 'aqi-good', status: 'Good' };
        if (aqi <= 100) return { color: [234, 179, 8], class: 'aqi-moderate', status: 'Moderate' };
        if (aqi <= 150) return { color: [249, 115, 22], class: 'aqi-sensitive', status: 'Sensitive' };
        if (aqi <= 200) return { color: [239, 68, 68], class: 'aqi-unhealthy', status: 'Unhealthy' };
        if (aqi <= 300) return { color: [220, 38, 38], class: 'aqi-very-unhealthy', status: 'Very Unhealthy' };
        return { color: [124, 58, 237], class: 'aqi-hazardous', status: 'Hazardous' };
    }

    async function fetchData() {
        const CHUNK_SIZE = 50;
        const results = [];
        for (let i = 0; i < CITIES.length; i += CHUNK_SIZE) {
            const batch = CITIES.slice(i, i + CHUNK_SIZE);
            const lats = batch.map(c => c.lat).join(',');
            const lons = batch.map(c => c.lon).join(',');
            try {
                const url = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lats}&longitude=${lons}&current=us_aqi`;
                const res = await fetch(url);
                const data = await res.json();
                if (Array.isArray(data)) {
                    data.forEach((d, idx) => results.push({ ...batch[idx], aqi: d.current?.us_aqi || 0 }));
                } else if (data.current) {
                    results.push({ ...batch[0], aqi: data.current.us_aqi || 0 });
                }
            } catch (e) {
                batch.forEach(c => results.push({ ...c, aqi: 0 }));
            }
            if (i + CHUNK_SIZE < CITIES.length) await new Promise(r => setTimeout(r, 100));
        }
        
        cityData = results.filter(c => c.aqi > 0).sort((a, b) => b.aqi - a.aqi);
        if (cityData.length === 0) { setTimeout(fetchData, 5000); return; }
        
        // Calculate Global Avg
        const avg = Math.round(cityData.reduce((s, c) => s + c.aqi, 0) / cityData.length);
        const avgInfo = getAQI(avg);
        const avgEl = document.getElementById('global-avg');
        if (avgEl) {
            avgEl.textContent = avg;
            avgEl.style.color = `rgb(${avgInfo.color.join(',')})`;
        }
        document.getElementById('status-bar').classList.add('visible');

        initParticles();
        document.getElementById('loading').classList.add('hidden');
    }

    function initParticles() {
        particles = [];
        cityData.forEach(city => {
            const info = getAQI(city.aqi);
            
            // Reduced particle count (from 100 + aqi to 40 + aqi*0.8)
            const count = 40 + Math.floor(city.aqi * 0.8); 
            
            const { x: baseX, y: baseY } = latLonToWorld(city.lat, city.lon);
            
            // Reduced spread (from 200 to 80)
            const spread = 80;
            
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: baseX + (Math.random() - 0.5) * spread * 2,
                    y: baseY + (Math.random() - 0.5) * spread * 2,
                    baseX, baseY,
                    // Good agitation velocity
                    vx: (Math.random() - 0.5) * 1.0,
                    vy: (Math.random() - 0.5) * 1.0,
                    color: info.color,
                    size: 1 + Math.random() * 3,
                    alpha: 0.1 + Math.random() * 0.4,
                    aqi: city.aqi
                });
            }
        });
    }

    function render() {
        ctx.fillStyle = '#030508';
        ctx.fillRect(0, 0, canvas.width / window.devicePixelRatio, canvas.height / window.devicePixelRatio);
        
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            const dx = p.baseX - p.x;
            const dy = p.baseY - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            // Tighter tether radius (80) & stronger pull (0.005)
            if (dist > 80) {
                p.vx += dx * 0.005; 
                p.vy += dy * 0.005;
            }
            
            // Moderate agitation
            p.vx += (Math.random() - 0.5) * 0.15;
            p.vy += (Math.random() - 0.5) * 0.15;
            p.vx *= 0.94; // Higher friction to keep contained
            p.vy *= 0.94;
            
            const s = worldToScreen(p.x, p.y);
            if (s.x < -10 || s.x > view.width + 10 || s.y < -10 || s.y > view.height + 10) return;
            
            ctx.beginPath();
            const drawSize = p.size * Math.sqrt(Math.max(0.5, view.zoom));
            ctx.arc(s.x, s.y, drawSize, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${p.color[0]}, ${p.color[1]}, ${p.color[2]}, ${p.alpha})`;
            ctx.fill();
        });

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const fontSize = Math.max(9, Math.min(12, 10 * view.zoom));
        ctx.font = `${fontSize}px -apple-system, BlinkMacSystemFont, sans-serif`;
        
        cityData.forEach(city => {
             const wPos = latLonToWorld(city.lat, city.lon);
             const sPos = worldToScreen(wPos.x, wPos.y);
             if (sPos.x < -50 || sPos.x > view.width + 50 || sPos.y < -50 || sPos.y > view.height + 50) return;

             // Highlight focused city with pulsing ring
             if (city === focusedCity) {
                 const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 200);
                 const ringSize = 30 + pulse * 10;
                 ctx.strokeStyle = `rgba(255, 255, 255, ${0.6 * pulse})`;
                 ctx.lineWidth = 2;
                 ctx.beginPath();
                 ctx.arc(sPos.x, sPos.y, ringSize, 0, Math.PI * 2);
                 ctx.stroke();
             }

             ctx.fillStyle = city === focusedCity ? 'rgba(255, 255, 255, 1)' : 'rgba(255, 255, 255, 0.4)';
             if (view.zoom > 0.6 || city.aqi > 150 || city === focusedCity) {
                 ctx.fillText(city.name.toLowerCase(), sPos.x, sPos.y);
             }
        });
        
        requestAnimationFrame(render);
    }

    fetchData();
    render();
    setInterval(fetchData, 600000);
    </script>
</body>
</html>
