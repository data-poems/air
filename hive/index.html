<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Very Pulse of the Machine</title>
    <meta property="og:title" content="The Very Pulse of the Machine">
    <meta property="og:description" content="A breathing AQI constellation across global regions.">
    <meta property="og:url" content="https://dr.eamer.dev/datavis/poems/air/hive/">
    <meta property="og:image" content="https://dr.eamer.dev/datavis/poems/air/hive/social-card.jpg">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="The Very Pulse of the Machine">
    <meta name="twitter:description" content="A breathing AQI constellation across global regions.">
    <meta name="twitter:image" content="https://dr.eamer.dev/datavis/poems/air/hive/social-card.jpg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: radial-gradient(1200px 800px at 50% 40%, #081826 0%, #050b12 45%, #030508 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            color: #e0e0e0;
            overflow: hidden;
            touch-action: none; 
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(600px 600px at 20% 25%, rgba(41, 255, 214, 0.08), transparent 60%),
                radial-gradient(500px 500px at 80% 30%, rgba(124, 58, 237, 0.08), transparent 60%),
                radial-gradient(700px 700px at 50% 80%, rgba(56, 189, 248, 0.06), transparent 60%);
            pointer-events: none;
        }
        #canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
        }
        .header {
            position: fixed;
            top: 24px; left: 50%; transform: translateX(-50%);
            text-align: center; z-index: 100; pointer-events: none;
            display: flex; flex-direction: column; gap: 8px; align-items: center;
        }
        .title {
            font-size: 11px; color: #4a5560; letter-spacing: 3px; text-transform: lowercase;
            text-decoration: none; pointer-events: auto;
        }
        .legend {
            position: fixed; bottom: 24px; left: 24px;
            display: flex; gap: 8px; z-index: 100; pointer-events: none;
            flex-wrap: wrap; max-width: 50vw;
            padding: 6px 8px;
            background: rgba(5, 10, 14, 0.35);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            backdrop-filter: blur(6px);
        }
        .legend-item {
            display: flex; align-items: center; gap: 6px;
            font-size: 9px; color: #9aa6b2; text-transform: lowercase; letter-spacing: 1px;
        }
        .legend-dot { width: 6px; height: 6px; border-radius: 50%; opacity: 0.8; }
        
        .tooltip {
            position: fixed; background: rgba(10, 14, 18, 0.9);
            border: 1px solid rgba(255,255,255,0.05); padding: 8px 12px;
            border-radius: 4px; pointer-events: none; z-index: 100;
            backdrop-filter: blur(8px); opacity: 0; transition: opacity 0.2s;
            transform: translate(-50%, -100%); margin-top: -15px; text-align: center;
        }
        .tooltip.visible { opacity: 1; }
        .city-name { font-size: 10px; color: #888; letter-spacing: 1px; margin-bottom: 2px; text-transform: uppercase; }
        .aqi-val { font-size: 14px; font-weight: 400; color: #fff; }
        .loading {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 10px; color: #4a5560; letter-spacing: 2px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <a href="https://dr.eamer.dev" class="title">the very pulse of the machine</a>
    </div>

    <canvas id="canvas"></canvas>
    <div id="tooltip" class="tooltip">
        <div class="city-name"></div>
        <div class="aqi-val"></div>
    </div>
    <div class="loading" id="loading">initializing...</div>
    <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div>good</div>
        <div class="legend-item"><div class="legend-dot" style="background:#eab308"></div>moderate</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div>unhealthy+</div>
    </div>

<script>
    // Region mapping for Hive Axes
    const REGIONS = {
        'North America': ['New York', 'Los Angeles', 'Chicago', 'Houston', 'Toronto', 'Mexico City', 'San Francisco', 'Miami', 'Vancouver', 'Montreal'],
        'South America': ['São Paulo', 'Buenos Aires', 'Lima', 'Bogotá', 'Santiago', 'Rio de Janeiro'],
        'Europe': ['London', 'Paris', 'Berlin', 'Madrid', 'Rome', 'Moscow', 'Istanbul', 'Amsterdam', 'Warsaw', 'Kiev', 'Stockholm'],
        'Asia': ['Tokyo', 'Beijing', 'Shanghai', 'Delhi', 'Mumbai', 'Seoul', 'Bangkok', 'Jakarta', 'Karachi', 'Dhaka', 'Osaka', 'Manila', 'Ho Chi Minh', 'Taipei', 'Hong Kong', 'Singapore', 'Kuala Lumpur', 'Bengaluru'],
        'Africa/ME': ['Cairo', 'Lagos', 'Johannesburg', 'Nairobi', 'Kinshasa', 'Casablanca', 'Dubai', 'Tehran', 'Baghdad', 'Tel Aviv'],
        'Oceania': ['Sydney', 'Melbourne', 'Auckland']
    };

    const AXES = Object.keys(REGIONS);
    const AXIS_COLORS = ['#2dd4bf', '#38bdf8', '#a78bfa', '#f472b6', '#f59e0b', '#22c55e'];
    let cityData = [];
    let viewScale = 1;
    
    // Viewport
    let cx, cy;
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const tooltip = document.getElementById('tooltip');

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        ctx.scale(dpr, dpr);
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        cx = window.innerWidth / 2;
        cy = window.innerHeight / 2;
    }
    resize();
    window.addEventListener('resize', resize);

    function getAQI(aqi) {
        if (aqi <= 50) return { color: '#22c55e', level: 0 };
        if (aqi <= 100) return { color: '#eab308', level: 1 };
        if (aqi <= 150) return { color: '#f97316', level: 2 };
        if (aqi <= 200) return { color: '#ef4444', level: 3 };
        if (aqi <= 300) return { color: '#dc2626', level: 4 };
        return { color: '#7c3aed', level: 5 };
    }

    // Interaction
    let mouse = { x: 0, y: 0 };
    canvas.addEventListener('mousemove', e => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        checkHover();
    });
    canvas.addEventListener('wheel', e => {
        e.preventDefault();
        const delta = -e.deltaY * 0.0015;
        viewScale = Math.min(1.5, Math.max(0.85, viewScale + delta));
    }, { passive: false });
    canvas.addEventListener('touchstart', e => {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
        checkHover();
    }, {passive: true});
    let pinchStart = null;
    canvas.addEventListener('touchstart', e => {
        if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            pinchStart = Math.hypot(dx, dy);
        }
    }, {passive: true});
    canvas.addEventListener('touchmove', e => {
        if (e.touches.length === 2 && pinchStart) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.hypot(dx, dy);
            const delta = (dist - pinchStart) * 0.0009;
            viewScale = Math.min(1.5, Math.max(0.85, viewScale + delta));
            pinchStart = dist;
        }
    }, {passive: true});
    canvas.addEventListener('touchend', () => {
        pinchStart = null;
    }, {passive: true});

    let hoveredCity = null;

    function checkHover() {
        let nearest = null;
        let minDist = 20;

        cityData.forEach(city => {
            const d = Math.hypot(mouse.x - city.x, mouse.y - city.y);
            if (d < minDist) {
                minDist = d;
                nearest = city;
            }
        });

        if (nearest !== hoveredCity) {
            hoveredCity = nearest;
            if (hoveredCity) {
                tooltip.querySelector('.city-name').textContent = hoveredCity.name;
                tooltip.querySelector('.aqi-val').textContent = `${hoveredCity.aqi} AQI`;
                tooltip.querySelector('.aqi-val').style.color = hoveredCity.color;
                tooltip.classList.add('visible');
                canvas.style.cursor = 'pointer';
            } else {
                tooltip.classList.remove('visible');
                canvas.style.cursor = 'default';
            }
        }
        
        if (hoveredCity) {
            tooltip.style.left = hoveredCity.x + 'px';
            tooltip.style.top = (hoveredCity.y - 10) + 'px';
        }
    }

    async function fetchData() {
        const flatCities = [];
        Object.entries(REGIONS).forEach(([region, cities]) => {
            cities.forEach(name => flatCities.push({name, region}));
        });

        // We'll mock the fetch for the snippet, but use real logic
        const CHUNK_SIZE = 50;
        
        // Find coordinates (using the master list from previous files logic, compacted here)
        // For simplicity in this specialized view, we'll reuse the previous coordinates map
        // Or actually, we need to fetch them.
        // Let's assume we have the lat/lons. I'll paste the big array logic briefly.
        const MASTER_LIST = [
            { name: 'New York', lat: 40.7128, lon: -74.0060 },
            { name: 'Los Angeles', lat: 34.0522, lon: -118.2437 },
            { name: 'Chicago', lat: 41.8781, lon: -87.6298 },
            { name: 'Houston', lat: 29.7604, lon: -95.3698 },
            { name: 'Toronto', lat: 43.6532, lon: -79.3832 },
            { name: 'Mexico City', lat: 19.4326, lon: -99.1332 },
            { name: 'San Francisco', lat: 37.7749, lon: -122.4194 },
            { name: 'Miami', lat: 25.7617, lon: -80.1918 },
            { name: 'Vancouver', lat: 49.2827, lon: -123.1207 },
            { name: 'Montreal', lat: 45.5017, lon: -73.5673 },
            { name: 'São Paulo', lat: -23.5505, lon: -46.6333 },
            { name: 'Buenos Aires', lat: -34.6037, lon: -58.3816 },
            { name: 'Lima', lat: -12.0464, lon: -77.0428 },
            { name: 'Bogotá', lat: 4.7110, lon: -74.0721 },
            { name: 'Santiago', lat: -33.4489, lon: -70.6693 },
            { name: 'Rio de Janeiro', lat: -22.9068, lon: -43.1729 },
            { name: 'London', lat: 51.5074, lon: -0.1278 },
            { name: 'Paris', lat: 48.8566, lon: 2.3522 },
            { name: 'Berlin', lat: 52.5200, lon: 13.4050 },
            { name: 'Madrid', lat: 40.4168, lon: -3.7038 },
            { name: 'Rome', lat: 41.9028, lon: 12.4964 },
            { name: 'Moscow', lat: 55.7558, lon: 37.6173 },
            { name: 'Istanbul', lat: 41.0082, lon: 28.9784 },
            { name: 'Amsterdam', lat: 52.3676, lon: 4.9041 },
            { name: 'Warsaw', lat: 52.2297, lon: 21.0122 },
            { name: 'Kiev', lat: 50.4501, lon: 30.5234 },
            { name: 'Stockholm', lat: 59.3293, lon: 18.0686 },
            { name: 'Cairo', lat: 30.0444, lon: 31.2357 },
            { name: 'Lagos', lat: 6.5244, lon: 3.3792 },
            { name: 'Johannesburg', lat: -26.2041, lon: 28.0473 },
            { name: 'Nairobi', lat: -1.2921, lon: 36.8219 },
            { name: 'Kinshasa', lat: -4.4419, lon: 15.2663 },
            { name: 'Casablanca', lat: 33.5731, lon: -7.5898 },
            { name: 'Dubai', lat: 25.2048, lon: 55.2708 },
            { name: 'Tehran', lat: 35.6892, lon: 51.3890 },
            { name: 'Baghdad', lat: 33.3152, lon: 44.3661 },
            { name: 'Tel Aviv', lat: 32.0853, lon: 34.7818 },
            { name: 'Tokyo', lat: 35.6762, lon: 139.6503 },
            { name: 'Beijing', lat: 39.9042, lon: 116.4074 },
            { name: 'Shanghai', lat: 31.2304, lon: 121.4737 },
            { name: 'Delhi', lat: 28.7041, lon: 77.1025 },
            { name: 'Mumbai', lat: 19.0760, lon: 72.8777 },
            { name: 'Seoul', lat: 37.5665, lon: 126.9780 },
            { name: 'Bangkok', lat: 13.7563, lon: 100.5018 },
            { name: 'Jakarta', lat: -6.2088, lon: 106.8456 },
            { name: 'Karachi', lat: 24.8607, lon: 67.0011 },
            { name: 'Dhaka', lat: 23.8103, lon: 90.4125 },
            { name: 'Osaka', lat: 34.6937, lon: 135.5023 },
            { name: 'Manila', lat: 14.5995, lon: 120.9842 },
            { name: 'Ho Chi Minh', lat: 10.8231, lon: 106.6297 },
            { name: 'Taipei', lat: 25.0330, lon: 121.5654 },
            { name: 'Hong Kong', lat: 22.3193, lon: 114.1694 },
            { name: 'Singapore', lat: 1.3521, lon: 103.8198 },
            { name: 'Kuala Lumpur', lat: 3.1390, lon: 101.6869 },
            { name: 'Bengaluru', lat: 12.9716, lon: 77.5946 },
            { name: 'Sydney', lat: -33.8688, lon: 151.2093 },
            { name: 'Melbourne', lat: -37.8136, lon: 144.9631 },
            { name: 'Auckland', lat: -36.8485, lon: 174.7633 }
        ];

        // 1. Fetch
        const results = [];
        for (let i = 0; i < MASTER_LIST.length; i += CHUNK_SIZE) {
            const batch = MASTER_LIST.slice(i, i + CHUNK_SIZE);
            const lats = batch.map(c => c.lat).join(',');
            const lons = batch.map(c => c.lon).join(',');
            try {
                const url = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lats}&longitude=${lons}&current=us_aqi`;
                const res = await fetch(url);
                const data = await res.json();
                if (Array.isArray(data)) {
                    data.forEach((d, idx) => results.push({ ...batch[idx], aqi: d.current?.us_aqi || 0 }));
                } else if (data.current) {
                    results.push({ ...batch[0], aqi: data.current.us_aqi || 0 });
                }
            } catch (e) {
                batch.forEach(c => results.push({ ...c, aqi: 0 }));
            }
            if (i + CHUNK_SIZE < MASTER_LIST.length) await new Promise(r => setTimeout(r, 100));
        }

        // 2. Process for Hive
        cityData = [];
        const maxAqi = Math.max(1, ...results.map(c => c.aqi || 0));
        results.forEach(city => {
            // Find region
            let region = 'Other';
            for (const [r, list] of Object.entries(REGIONS)) {
                if (list.includes(city.name)) region = r;
            }
            const axisIndex = AXES.indexOf(region);
            if (axisIndex === -1) return;

            const info = getAQI(city.aqi);
            cityData.push({
                ...city,
                region,
                axisIndex,
                color: info.color,
                // Normalized position on axis (0 to 1) relative to current max AQI
                // Use sqrt to soften extremes and feel more even across regions
                norm: Math.sqrt(Math.min(city.aqi, maxAqi) / maxAqi)
            });
        });

        document.getElementById('loading').classList.add('hidden');
        animate();
    }

    function animate() {
        ctx.fillStyle = '#030508';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const t = performance.now() * 0.0018;
        const radius = Math.min(cx, cy) * 0.8 * viewScale;
        const centerRadius = 40; // Empty space in middle

        // 1. Draw Axes
        ctx.lineWidth = 1.2;
        const rotation = Math.PI / 6; // rotate away from top
        AXES.forEach((axis, i) => {
            const angle = (i / AXES.length) * Math.PI * 2 - Math.PI/2 + rotation;
            const x = cx + Math.cos(angle) * radius;
            const y = cy + Math.sin(angle) * radius;
            ctx.strokeStyle = AXIS_COLORS[i % AXIS_COLORS.length];
            ctx.globalAlpha = 0.35;
            ctx.shadowColor = AXIS_COLORS[i % AXIS_COLORS.length];
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;

            // Label
            ctx.fillStyle = AXIS_COLORS[i % AXIS_COLORS.length];
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const lx = cx + Math.cos(angle) * (radius + 20);
            const ly = cy + Math.sin(angle) * (radius + 20);
            ctx.font = '10px -apple-system, sans-serif';
            ctx.globalAlpha = 0.8;
            ctx.fillText(axis.toUpperCase(), lx, ly);
            ctx.globalAlpha = 1;
        });

        // 2. Plot Cities & Store Coordinates
        cityData.forEach(city => {
            const angle = (city.axisIndex / AXES.length) * Math.PI * 2 - Math.PI/2 + rotation;
            // Add slight jitter/spread per axis so they don't overlap perfectly
            // Sort by AQI? No, position is AQI. 
            // We only have one dimension (distance).
            // To prevent overlap, we can't really move them L/R without violating the plot logic.
            // But we can pulse them or just draw them.
            
            const r = centerRadius + (city.norm * (radius - centerRadius));
            city.x = cx + Math.cos(angle) * r;
            city.y = cy + Math.sin(angle) * r;
        });

        // 3. Draw Links (Connect similar AQI levels across regions)
        // Group by AQI band
        const bands = [[0,50], [51,100], [101,150], [151,200], [201,300], [301,999]];
        
        ctx.lineWidth = 0.5;
        
        // For every city, try to find neighbor axes cities with similar AQI
        cityData.forEach(city => {
            // Find nearest neighbors in other regions
            cityData.forEach(other => {
                if (city === other) return;
                // Only connect adjacent axes for cleaner look
                const axisDiff = Math.abs(city.axisIndex - other.axisIndex);
                if (axisDiff === 1 || axisDiff === AXES.length - 1) {
                    // Only connect if AQI is somewhat similar (within 20 points)
                    if (Math.abs(city.aqi - other.aqi) < 30) {
                        ctx.beginPath();
                        ctx.moveTo(city.x, city.y);
                        
                        // Bezier curve towards center
                        // Control point is halfway between, but pulled towards center
                        const midX = (city.x + other.x) / 2;
                        const midY = (city.y + other.y) / 2;
                        const cpX = (cx + midX) / 2;
                        const cpY = (cy + midY) / 2;
                        
                        ctx.quadraticCurveTo(cpX, cpY, other.x, other.y);
                        
                        // Color coded transition between city colors
                        const grad = ctx.createLinearGradient(city.x, city.y, other.x, other.y);
                        grad.addColorStop(0, city.color);
                        grad.addColorStop(1, other.color);
                        ctx.strokeStyle = grad;
                        const pulse = 1 + 0.56 * Math.sin(t);
                        ctx.lineWidth = 0.6 * pulse;
                        ctx.globalAlpha = 0.18;
                        ctx.stroke();
                        ctx.globalAlpha = 1;
                    }
                }
            });
        });

        // 4. Draw Nodes
        cityData.forEach(city => {
            const pulse = 1 + 0.28 * Math.sin(t);
            const nodeSize = 2.8 * pulse;
            ctx.beginPath();
            ctx.arc(city.x, city.y, nodeSize, 0, Math.PI * 2);
            ctx.fillStyle = city.color;
            
            // Hover effect
            if (city === hoveredCity) {
                ctx.shadowColor = city.color;
                ctx.shadowBlur = 15;
                ctx.fillStyle = '#fff';
            }
            
            ctx.fill();
            ctx.shadowBlur = 0;
        });

        requestAnimationFrame(animate);
    }

    fetchData();
</script>
</body>
</html>
